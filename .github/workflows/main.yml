name: Deploy to EC2 using CodeDeploy

on:
  push:
    branches:
      - master2
      - 'releases/**'

jobs:
  deploy:
    name: Deploy App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Zip application
        run: zip -r app.zip . -x '*.git*'

      - name: Upload to S3
        uses: jakejarvis/s3-sync-action@master
        with:
          args: --acl private --follow-symlinks --delete
        env:
          AWS_S3_BUCKET: springboot-deploy-artifacts-prem
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-south-1
          SOURCE_DIR: './'
          DEST_DIR: 'ecommerce-app'

      - name: Deploy to EC2 using CodeDeploy via CLI
        run: |
          aws deploy create-deployment \
            --application-name EcommerceJavaApp \
            --deployment-group-name EcommerceDeploymentGroup \
            --s3-location bucket=springboot-deploy-artifacts-prem,bundleType=zip,key=ecommerce-app/app.zip \
            --deployment-config-name CodeDeployDefault.OneAtATime \
            --region ap-south-1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          #hiii
