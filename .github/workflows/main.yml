name: Deploy to EC2 using CodeDeploy

on:
  push:
    branches:
      - master2
      - 'releases/**'


jobs:
  deploy:
    name: Deploy App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Zip application
        run: zip -r app.zip . -x '*.git*'

      - name: Upload to S3
        uses: jakejarvis/s3-sync-action@master
        with:
          args: --acl private --follow-symlinks --delete
        env:
          AWS_S3_BUCKET: your-s3-bucket-name
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: your-region
          SOURCE_DIR: './'
          DEST_DIR: 'your-app-folder'

      - name: Deploy using CodeDeploy
        uses: webfactory/create-aws-codedeploy-deployment@v1
        with:
          application-name: EcommerceJavaApp
          deployment-group: EcommerceDeploymentGroup
          deployment-config-name: CodeDeployDefault.OneAtATime
          bundle-type: zip
          deployment-description: 'Deploy from GitHub Actions'
          s3-bucket: your-s3-bucket-name
          s3-key: your-app-folder/app.zip
          region: your-region
          wait-until-deployed: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
